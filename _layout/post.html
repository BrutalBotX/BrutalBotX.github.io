---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <hr>

  <div class="chapter-nav" style="display: flex; justify-content: space-between; margin-top: 20px; font-weight: bold;">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}">← Previous Chapter</a>
    {% else %}
      <span></span>
    {% endif %}

    <a href="/">Table of Contents</a>

    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}">Next Chapter →</a>
    {% else %}
      <span></span>
    {% endif %}
  </div>

  <br><hr><br>

  <div class="comments-section">
    <h3>Comments</h3>
    
    <script src="https://giscus.app/client.js"
            data-repo="YourUsername/YourRepoName"
            data-repo-id="YOUR_REPO_ID"
            data-category="Announcements"
            data-category-id="YOUR_CATEGORY_ID"
            data-mapping="pathname"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
    
  </div>
</article>
