---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div id="reader-controls" style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; border: 1px solid #ddd;">
    <button onclick="changeFontSize(-1)">A-</button>
    <button onclick="changeFontSize(1)">A+</button>
    <button onclick="toggleFontFamily()">Switch Font</button>
    <button onclick="toggleTheme()" id="theme-btn">🌙 Dark Mode</button>
  </div>

  <div class="post-content" id="chapter-text" style="font-size: 18px; line-height: 1.8;">
    {{ content }}
  </div>

  <div class="chapter-navigation" style="display: flex !important; justify-content: space-between; align-items: center; margin: 50px 0; padding: 25px 0; border-top: 2px solid #eee; border-bottom: 2px solid #eee;">
    
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}" style="text-decoration: none; color: #007bff;">← Previous Chapter</a>
    {% else %}
      <span style="color: #bbb;">← Start of Novel</span>
    {% endif %}

    <a href="{{ '/' | relative_url }}" style="font-weight: bold; text-decoration: none; color: #333; font-size: 1.1em;">Table of Contents</a>

    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}" style="text-decoration: none; color: #007bff;">Next Chapter →</a>
    {% else %}
      <span style="color: #bbb;">Latest Chapter →</span>
    {% endif %}
  </div>

  <div class="giscus-container" style="margin-top: 30px;">
    </div>

</article>

<script>
  // Simplified logic for theme/font persistence
  const text = document.getElementById('chapter-text');
  let size = localStorage.getItem('fontSize') || 18;
  let dark = localStorage.getItem('theme') === 'dark';

  function apply() {
    text.style.fontSize = size + 'px';
    document.body.classList.toggle('dark-mode', dark);
    document.getElementById('theme-btn').innerText = dark ? '☀️ Light Mode' : '🌙 Dark Mode';
    // Dark mode CSS injection
    if (dark) {
      document.body.style.backgroundColor = '#121212';
      document.body.style.color = '#e0e0e0';
    } else {
      document.body.style.backgroundColor = '#fff';
      document.body.style.color = '#333';
    }
  }

  function changeFontSize(s) { size = Math.min(Math.max(parseInt(size) + (s*2), 12), 36); localStorage.setItem('fontSize', size); apply(); }
  function toggleTheme() { dark = !dark; localStorage.setItem('theme', dark ? 'dark' : 'light'); apply(); }
  function toggleFontFamily() { text.style.fontFamily = text.style.fontFamily.includes('serif') ? 'sans-serif' : 'serif'; }
  
  apply();
</script>
