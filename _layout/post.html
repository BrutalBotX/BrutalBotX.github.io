---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}</p>
  </header>

  <div id="reader-controls" style="background: #f4f4f4; padding: 10px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;">
    <span style="font-weight: bold; margin-right: 10px;">Settings:</span>
    <button onclick="changeFontSize(-1)" style="padding: 5px 10px; cursor: pointer;">A-</button>
    <button onclick="changeFontSize(1)" style="padding: 5px 10px; cursor: pointer;">A+</button>
    <button onclick="toggleFontFamily()" style="padding: 5px 10px; cursor: pointer;">Font Style</button>
    <button onclick="toggleTheme()" style="padding: 5px 10px; cursor: pointer;">🌙 Dark Mode</button>
  </div>

  <div class="post-content" id="chapter-text" style="transition: all 0.3s ease;">
    {{ content }}
  </div>

  <hr>

  <div class="chapter-nav" style="display: flex; justify-content: space-between; margin-top: 20px; font-weight: bold;">
    {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}">← Previous</a>
    {% else %}
      <span></span>
    {% endif %}

    <a href="{{ '/' | relative_url }}">Table of Contents</a>

    {% if page.next %}
      <a href="{{ page.next.url | relative_url }}">Next →</a>
    {% else %}
      <span></span>
    {% endif %}
  </div>

  <br><hr><br>

  <div class="comments-section">
    <h3>Comments</h3>
    </div>
</article>

<script>
  // Elements
  const chapterText = document.getElementById('chapter-text');
  const body = document.body;
  
  // Load saved settings on page load
  let currentSize = localStorage.getItem('readerFontSize') ? parseInt(localStorage.getItem('readerFontSize')) : 18;
  let isDarkMode = localStorage.getItem('readerTheme') === 'dark';
  let isSerif = localStorage.getItem('readerFont') === 'serif';

  // Apply saved settings immediately
  chapterText.style.fontSize = currentSize + 'px';
  if (isDarkMode) applyDarkTheme();
  if (isSerif) applySerifFont();

  // Functions
  function changeFontSize(step) {
    currentSize += (step * 2);
    // Keep it within reasonable limits (12px to 32px)
    if (currentSize < 12) currentSize = 12;
    if (currentSize > 32) currentSize = 32;
    
    chapterText.style.fontSize = currentSize + 'px';
    localStorage.setItem('readerFontSize', currentSize);
  }

  function toggleTheme() {
    isDarkMode = !isDarkMode;
    if (isDarkMode) {
      applyDarkTheme();
      localStorage.setItem('readerTheme', 'dark');
    } else {
      applyLightTheme();
      localStorage.setItem('readerTheme', 'light');
    }
  }

  function toggleFontFamily() {
    isSerif = !isSerif;
    if (isSerif) {
      applySerifFont();
      localStorage.setItem('readerFont', 'serif');
    } else {
      applySansFont();
      localStorage.setItem('readerFont', 'sans');
    }
  }

  // CSS Injectors
  function applyDarkTheme() {
    body.style.backgroundColor = '#1a1a1a';
    body.style.color = '#e0e0e0';
    // Fix link colors for dark mode so they don't stay invisible blue
    let links = document.querySelectorAll('a');
    links.forEach(link => link.style.color = '#4da6ff');
  }

  function applyLightTheme() {
    body.style.backgroundColor = '#ffffff';
    body.style.color = '#333333';
    let links = document.querySelectorAll('a');
    links.forEach(link => link.style.color = ''); // reset to theme default
  }

  function applySerifFont() {
    chapterText.style.fontFamily = 'Georgia, "Times New Roman", serif';
    chapterText.style.lineHeight = '1.8';
  }

  function applySansFont() {
    chapterText.style.fontFamily = 'Arial, Helvetica, sans-serif';
    chapterText.style.lineHeight = '1.6';
  }
</script>
